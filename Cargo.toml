[package]
name = "pspr-planner"
version = "0.1.0"
edition = "2024"
description = "HDDL domain/problem loader and solver scaffold"
license = "AGPL-3.0-or-later"
readme = "README.md"

[features]
default = []
neural-base = ["dep:burn"]
neural = ["neural-base", "dep:rayon"]
neural-gpu = ["neural-base", "burn/wgpu"]

[lib]
name = "pspr"
path = "src/lib.rs"

[[bin]]
name = "pspr"
path = "src/main.rs"

[[bin]]
name = "train_merge_initializer"
path = "src/bin/train_merge_initializer.rs"
required-features = ["neural-base"]

[[bin]]
name = "train_decomposition_model"
path = "src/bin/train_decomposition_model.rs"
required-features = ["neural-base"]

[dependencies]
anyhow = "1.0.104"
burn = { version = "0.22.1", optional = true, default-features = false, features = ["std", "ndarray", "autodiff", "optim", "store", "safetensors"] }
clap = { version = "4", features = ["derive"] }
good_lp = { version = "1.15.3", default-features = false, features = ["scip", "scip_bundled"] }
nalgebra = "0.35.0"
rayon = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
